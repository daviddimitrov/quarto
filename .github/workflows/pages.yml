name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      # Cache-Version im ausgelieferten HTML auf den Commit setzen, bump.sh ist nicht mehr nötig
      - name: Cache-Version setzen
        run: |
          v=${GITHUB_SHA::7}
          sed -i -E "s/(main\.(js|css))\?v=[^\"]*/\1?v=$v/g" frontend/index.html frontend/login.html
          grep -o 'main\.[a-z]*?v=[0-9a-f]*' frontend/index.html
      - name: Nur App-Dateien ausliefern
        run: rm -rf frontend/package.json frontend/package-lock.json frontend/eslint.config.js frontend/node_modules frontend/bump.sh
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0D0E10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Quarto">
    <title>Quarto</title>
    <link rel="icon" type="image/x-icon" href="./assets/images/logo.ico">
    <link rel="apple-touch-icon" href="./assets/images/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script src="./js/main.js?v=149076d"></script>
    <link rel="stylesheet" href="./css/main.css?v=149076d">
</head>

<body>
    <div class="app">

        <!-- Seitenleiste, nur auf breiten Bildschirmen -->
        <aside class="sidebar">
            <div class="brand">Quarto</div>
            <nav class="side-nav">
                <button type="button" class="side-link" data-view="today"><i class="bi bi-sun"></i><span>Heute</span><span class="count mono" id="count-today"></span></button>
                <button type="button" class="side-link" data-view="work"><i class="bi bi-briefcase"></i><span>Arbeit</span><span class="count mono" id="count-work"></span></button>
                <button type="button" class="side-link" data-view="all"><i class="bi bi-list-ul"></i><span>Alle</span></button>
            </nav>
            <div class="side-budget" id="side-budget">
                <div class="label">Budget heute</div>
                <div class="mono value" id="side-budget-value">–</div>
                <div class="bar"><span class="fill"></span><span class="carry"></span></div>
            </div>
            <button type="button" class="side-link side-account" data-view="account"><i class="bi bi-person-circle"></i><span>Konto</span></button>
        </aside>

        <main class="main">
            <!-- Navigation auf dem iPhone -->
            <header class="topbar">
                <div class="seg" role="tablist">
                    <button type="button" data-view="today">Heute</button>
                    <button type="button" data-view="work">Arbeit</button>
                    <button type="button" data-view="all">Alle</button>
                </div>
                <button type="button" class="icon-btn" data-view="account" aria-label="Konto"><i class="bi bi-person-circle"></i></button>
            </header>

            <div class="page-head">
                <h1 id="view-title">Heute</h1>
                <span class="mono muted" id="view-date"></span>
            </div>

            <!-- Budget, nur in Heute -->
            <div class="budget" id="budget" hidden>
                <div class="mono budget-line" id="budget-line"></div>
                <div class="bar"><span class="fill"></span><span class="carry"></span></div>
            </div>

            <!-- Umschalter Privat/Arbeit, nur in Alle -->
            <div class="seg seg-small" id="kontext-toggle" hidden>
                <button type="button" data-kontext="privat">Privat</button>
                <button type="button" data-kontext="arbeit">Arbeit</button>
            </div>

            <div class="columns" id="lists">
                <section class="col-today">
                    <form id="quick-add" class="quick" autocomplete="off">
                        <i class="bi bi-plus-lg"></i>
                        <input id="quickInput" type="text" placeholder="Spontan: aufräumen, post" enterkeyhint="done">
                        <kbd class="key-hint">N</kbd>
                    </form>
                    <div id="task-list" class="list"></div>
                    <button type="button" class="ghost-btn" id="addTaskButton" hidden><i class="bi bi-plus-lg"></i> Neue Aufgabe</button>
                </section>

                <section class="col-long" id="long-section">
                    <button type="button" class="section-head" id="long-toggle">
                        <span>Langfristig</span>
                        <span class="mono muted" id="long-count"></span>
                        <span class="rule"></span>
                        <i class="bi bi-chevron-down chevron"></i>
                    </button>
                    <div id="long-list" class="list long"></div>
                    <form id="long-add" class="quick dashed" autocomplete="off">
                        <i class="bi bi-plus-lg"></i>
                        <input id="longInput" type="text" placeholder="Langfristig: Steuer bis 31.7." enterkeyhint="done">
                        <kbd class="key-hint">L</kbd>
                        <button type="button" class="info-btn" data-info="Mehrere To-dos mit Komma trennen.<br>Deadline mit <b>bis</b>: bis morgen, bis fr, bis 3.12., bis 3.12.2027<br>Ab zwei Tagen vorher wird sie orange." aria-label="Hilfe"><i class="bi bi-info-circle"></i></button>
                    </form>
                    <div class="drag-hint key-hint">nach links ziehen = heute</div>
                </section>
            </div>

            <!-- Konto -->
            <section id="account-section" class="account" hidden>
                <form id="account-form">
                    <label class="field">
                        <span>Tägliches Zeitlimit</span>
                        <div class="with-unit"><input type="number" id="dailyLimit" min="1" max="240" inputmode="numeric"><span class="mono muted">min</span></div>
                    </label>
                    <label class="field">
                        <span>Maximal mit Übertrag</span>
                        <div class="with-unit"><input type="number" id="maxLimit" min="1" max="240" inputmode="numeric"><span class="mono muted">min</span></div>
                    </label>
                    <p class="muted small">Heutiges Budget: <span class="mono" id="budgetToday">–</span> min</p>
                    <div id="accountMessage" class="small"></div>
                    <div class="actions">
                        <button type="submit" class="btn primary">Speichern</button>
                        <button type="button" class="btn" id="logoutButton">Logout</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <!-- Menü für eine Zeile -->
    <div id="row-menu" class="menu" hidden></div>

    <!-- Info-Popover -->
    <div id="pop" class="pop" hidden></div>

    <!-- Details: Unteraufgaben und Notiz -->
    <dialog id="noteModal" class="dialog">
        <form method="dialog" id="note-form">
            <h2 id="noteModalTitle">Details</h2>
            <input type="hidden" id="noteTaskId">
            <label class="field">
                <span>Unteraufgaben, eine pro Zeile</span>
                <textarea id="noteSubtasks" rows="6"></textarea>
            </label>
            <label class="field">
                <span>Notiz</span>
                <textarea id="noteText" rows="3" placeholder="Infos, Links"></textarea>
            </label>
            <div class="actions">
                <button type="button" class="btn" data-close>Abbrechen</button>
                <button type="submit" class="btn primary" value="save">Speichern</button>
            </div>
        </form>
    </dialog>

    <!-- Löschen -->
    <dialog id="deleteTaskModal" class="dialog dialog-small">
        <form method="dialog">
            <p>Soll <b id="toBeDeletedTaskName"></b> wirklich gelöscht werden?</p>
            <div class="actions">
                <button type="button" class="btn" data-close>Nein</button>
                <button type="button" class="btn danger" id="toBeDeletedTaskButton">Löschen</button>
            </div>
        </form>
    </dialog>

    <!-- Neue Aufgabe und Bearbeiten -->
    <dialog id="taskModal" class="dialog">
        <form id="task-form">
            <h2 id="taskModalTitle">Neue Aufgabe</h2>
            <input type="hidden" id="editTaskId">
            <label class="field">
                <span>Aufgabe</span>
                <input required type="text" id="inputTask" placeholder="Hamster waschen">
            </label>
            <div class="grid2">
                <label class="field">
                    <span>Fällig am</span>
                    <input required type="date" id="pickDueDate">
                </label>
                <label class="field">
                    <span>Rhythmus <button type="button" class="info-btn" data-info="<b>7</b> = alle 7 Tage nach Erledigung<br><b>do</b> = jeden Donnerstag (mo, di, mi, do, fr, sa, so)<br><b>15.</b> = jeden Monat am 15.<br><b>eom</b> = letzter Tag im Monat<br><b>0</b> = einmalig" aria-label="Hilfe"><i class="bi bi-info-circle"></i></button></span>
                    <input type="text" placeholder="7, do, 15. oder eom" autocapitalize="none" required id="inputFrequency">
                </label>
                <label class="field private-only">
                    <span>Priorität</span>
                    <select id="selectPriority">
                        <option value="4">Niedrig</option>
                        <option value="3">Mittel</option>
                        <option value="2">Hoch</option>
                        <option value="1">ASAP</option>
                    </select>
                </label>
                <label class="field private-only">
                    <span>Dauer</span>
                    <div class="with-unit"><input type="number" id="inputDuration" min="1" inputmode="numeric" placeholder="15"><span class="mono muted">min</span></div>
                </label>
            </div>
            <label class="field">
                <span>Unteraufgaben, eine pro Zeile</span>
                <textarea id="inputSubtasks" rows="3"></textarea>
            </label>
            <label class="field">
                <span>Notiz</span>
                <textarea id="inputNote" rows="2" placeholder="Infos, Links"></textarea>
            </label>
            <div class="actions">
                <button type="button" class="btn" data-close>Abbrechen</button>
                <button type="submit" class="btn primary">Speichern</button>
            </div>
        </form>
    </dialog>

    <script>
        $(document).ready(function () {
            checkAuth();
            initUi();
            setView({'#alle': 'all', '#arbeit': 'work', '#konto': 'account'}[location.hash] || 'today');
        });
    </script>
</body>

</html>

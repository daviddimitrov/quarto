<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarto</title>
    <link rel="icon" type="image/x-icon" href="./assets/images/logo.ico">
    <link rel="apple-touch-icon" href="./assets/images/apple-touch-icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script src="./js/main.js?v=e02ba50"></script>
    <link rel="stylesheet" href="./css/main.css?v=e02ba50">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <i class="bi-class-name"></i>
            </button>
            <a class="navbar-brand" href="#">Quarto</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" id="today-link" data-bs-toggle="collapse" data-bs-target="#navbarNav">Heute</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="work-link" data-bs-toggle="collapse" data-bs-target="#navbarNav">Arbeit</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="all-link" data-bs-toggle="collapse" data-bs-target="#navbarNav">Alle</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="account-link" data-bs-toggle="collapse" data-bs-target="#navbarNav">Konto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container d-flex flex-column justify-content-center align-items-center" style="padding-top: 25px">
        <div class="card p-4 shadow-lg" style="width: 100%;">
            <div id="card-content">
                <h3 class="text-center mb-4 table-header">Heutige Aufgaben</h3>

                <!-- Umschalter Privat/Arbeit, nur in "Alle" -->
                <div id="kontext-toggle" class="btn-group btn-group-sm mb-3 w-100" role="group" style="display: none;">
                    <button type="button" class="btn btn-outline-success" data-kontext="privat" onclick="setAllKontext('privat')">Privat</button>
                    <button type="button" class="btn btn-outline-success" data-kontext="arbeit" onclick="setAllKontext('arbeit')">Arbeit</button>
                </div>

                <!-- Konto: Zeitlimits und Logout -->
                <div id="account-section" style="display: none;">
                    <form onsubmit="event.preventDefault(); saveAccount();">
                        <div class="mb-3">
                            <label for="dailyLimit" class="form-label">Tägliches Zeitlimit (Minuten)</label>
                            <input type="number" class="form-control" id="dailyLimit" min="1" max="240" inputmode="numeric">
                        </div>
                        <div class="mb-3">
                            <label for="maxLimit" class="form-label">Maximales Zeitlimit mit Übertrag (Minuten)</label>
                            <input type="number" class="form-control" id="maxLimit" min="1" max="240" inputmode="numeric">
                        </div>
                        <p class="text-muted small">Heutiges Budget: <span id="budgetToday">–</span> Minuten</p>
                        <div id="accountMessage" class="small mb-2"></div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-outline-success">Speichern</button>
                            <button type="button" class="btn btn-outline-success ms-auto" onclick="logout();">Logout</button>
                        </div>
                    </form>
                </div>

                <!-- Schnelle Eingabe für spontane To-dos, nur in "Heute" -->
                <form id="quick-add" class="mb-3" onsubmit="event.preventDefault(); if (window.quickAdd) quickAdd(event);" autocomplete="off">
                    <input id="quickInput" type="text" class="form-control" placeholder="aufräumen, einkaufen, post" enterkeyhint="done">
                </form>

                <table class="table table-hover align-middle mb-0">
                    <tbody></tbody>
                </table>
                <button type="button" class="btn btn-sm btn-outline-success bi bi-plus" data-bs-toggle="modal" data-bs-target="#exampleModalCenter" id="addTaskButton"></button>

                <!-- Langfristige To-dos, direkt unter der Heute-Liste -->
                <div id="long-section">
                    <table class="table table-hover align-middle mb-2">
                        <tbody id="long-body"></tbody>
                    </table>
                    <form id="long-add" onsubmit="event.preventDefault(); if (window.longAdd) longAdd(event);" autocomplete="off">
                        <div class="input-group"><input id="longInput" type="text" class="form-control" placeholder="Langfristig: Steuererklärung, Fahrrad reparieren" enterkeyhint="done"><span class="input-group-text bg-white"><a tabindex="0" role="button" class="info-badge ms-1" data-bs-toggle="popover" data-bs-trigger="focus" data-bs-placement="top" data-bs-html="true" data-bs-content="Mehrere To-dos mit Komma trennen.<br>Deadline mit <b>bis</b>: bis morgen, bis fr, bis 3.12., bis 3.12.2027<br>Ab zwei Tagen vorher wird sie rot."><i class="bi bi-info-circle"></i></a></span></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal fade" id="deleteTaskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-body">
                    Soll <span id="toBeDeletedTaskName">"Hamster waschen"</span> wirklich gelöscht werden?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-sm btn-outline-success" data-bs-dismiss="modal">Nein</button>
                    <button type="button" class="btn btn-sm btn-outline-success" id="toBeDeletedTaskButton">Ja</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Modal -->
    <div class="modal fade" id="exampleModalCenter" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Neue Aufgabe</h5>
                    <button type="button" class="btn btn-sm btn-outline-success bi bi-x close" data-bs-toggle="modal" data-bs-target="#exampleModalCenter"></button>
                </div>
                <div class="modal-body">
                    <form id="add-task-form">
                        <div class="container-fluid">
                            <div class="row" style="padding-bottom: 20px;">
                                <div class="col-sm-12">
                                    <div class="form-group">
                                        <label for="inputTask">Aufgabe</label>
                                        <input required type="text" class="form-control" id="inputTask" placeholder="Hamster waschen">
                                    </div>
                                </div>
                            </div>
                            <div class="row" style="padding-bottom: 20px;">
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label for="selectPriority">Priorität</label>
                                        <select class="form-control" id="selectPriority">
                                            <option value="4">LOW</option>
                                            <option value="3">MEDIUM</option>
                                            <option value="2">HIGH</option>
                                            <option value="1">ASAP</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label for="pickDueDate">Fällig am</label>
                                        <input required type="date" class="form-control" id="pickDueDate">
                                    </div>
                                </div>
                            </div>
                            <div class="row" style="padding-bottom: 20px;">
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label for="inputFrequency">Rhythmus <a tabindex="0" role="button" class="info-badge ms-1" data-bs-toggle="popover" data-bs-trigger="focus" data-bs-placement="top" data-bs-html="true" data-bs-content="<b>7</b> = alle 7 Tage nach Erledigung<br><b>do</b> = jeden Donnerstag (mo, di, mi, do, fr, sa, so)<br><b>15.</b> = jeden Monat am 15.<br><b>eom</b> = letzter Tag im Monat<br><b>0</b> = einmalig"><i class="bi bi-info-circle"></i></a></label>
                                        <input type="text" placeholder="7, do, 15. oder eom" autocapitalize="none" required class="form-control" id="inputFrequency">
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label for="inputDuration">Dauer in Minuten</label>
                                        <input required type="number" class="form-control" id="inputDuration" placeholder="Aufgabe dauert x Minuten">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-sm btn-outline-success bi bi-check task-create"></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editTaskModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Aufgabe bearbeiten</h5>
                    <button type="button" class="btn btn-sm btn-outline-success bi bi-x close" data-bs-toggle="modal" data-bs-target="#editTaskModal"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-task-form">
                        <input type="hidden" id="editTaskId">
                        <div class="container-fluid">
                            <div class="row" style="padding-bottom: 20px;">
                                <div class="col-sm-12">
                                    <div class="form-group">
                                        <label for="editInputTask">Aufgabe</label>
                                        <input required type="text" class="form-control" id="editInputTask">
                                    </div>
                                </div>
                            </div>
                            <div class="row" style="padding-bottom: 20px;">
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label for="editSelectPriority">Priorität</label>
                                        <select class="form-control" id="editSelectPriority">
                                            <option value="4">LOW</option>
                                            <option value="3">MEDIUM</option>
                                            <option value="2">HIGH</option>
                                            <option value="1">ASAP</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label for="editPickDueDate">Fällig am</label>
                                        <input required type="date" class="form-control" id="editPickDueDate">
                                    </div>
                                </div>
                            </div>
                            <div class="row" style="padding-bottom: 20px;">
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label for="editInputFrequency">Rhythmus <a tabindex="0" role="button" class="info-badge ms-1" data-bs-toggle="popover" data-bs-trigger="focus" data-bs-placement="top" data-bs-html="true" data-bs-content="<b>7</b> = alle 7 Tage nach Erledigung<br><b>do</b> = jeden Donnerstag (mo, di, mi, do, fr, sa, so)<br><b>15.</b> = jeden Monat am 15.<br><b>eom</b> = letzter Tag im Monat<br><b>0</b> = einmalig"><i class="bi bi-info-circle"></i></a></label>
                                        <input type="text" placeholder="7, do, 15. oder eom" autocapitalize="none" required class="form-control" id="editInputFrequency">
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label for="editInputDuration">Dauer in Minuten</label>
                                        <input required type="number" class="form-control" id="editInputDuration">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-sm btn-outline-success bi bi-check"></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            checkAuth();
            setView({'#alle': 'all', '#arbeit': 'work', '#konto': 'account'}[location.hash] || 'today');

            $("#add-task-form").submit(function(event){
                event.preventDefault();
                addTask();
            });

            $("#edit-task-form").submit(function(event){
                event.preventDefault();
                saveTaskEdit();
            });

            $('#today-link').click(function(event) {
                event.preventDefault();
                setView('today');
            });
            $('#work-link').click(function(event) {
                event.preventDefault();
                setView('work');
            });

            $('#all-link').click(function(event) {
                event.preventDefault();
                setView('all');
            });

            $(document).on('change', '.task-select', function () {
                toggleSelection($(this).val(), this.checked);
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

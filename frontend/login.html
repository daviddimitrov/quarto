<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0D0E10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Quarto">
    <title>Quarto</title>
    <link rel="icon" type="image/x-icon" href="./assets/images/logo.ico?v=2">
    <link rel="apple-touch-icon" href="./assets/images/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js" type="text/javascript"></script>
    <script src="./js/main.js?v=5a70c9c"></script>
    <link rel="stylesheet" href="./css/main.css?v=5a70c9c">
</head>

<body>
    <div class="login-page">
        <div class="login-card">
            <div class="brand-row">
                <h1>Quarto</h1>
                <img src="./assets/images/logo.png" alt="">
            </div>
            <form onsubmit="event.preventDefault(); login();">
                <label class="field">
                    <span>Name</span>
                    <input type="text" id="loginName" autocomplete="username" autocapitalize="none">
                </label>
                <label class="field">
                    <span>Passwort</span>
                    <input type="password" id="loginPassword" autocomplete="current-password">
                </label>
                <div id="loginError"></div>
                <button type="submit" class="btn primary">Login</button>
            </form>
        </div>
    </div>
</body>

</html>

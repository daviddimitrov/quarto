[tool.ruff]
line-length = 120
target-version = "py313"
src = ["backend/assets/python/_lambda/v2"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "RUF", "PL", "N", "PT"]
# Komplexität und Zahlen-Konstanten bewertet Sonar, Ruff soll dafür nicht doppelt anschlagen
ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "S105", "S106", "PLC0415", "PLR0904"]
# Der DynamoDB-Mock muss vor dem Import der Lambda-Module starten
"backend/tests/conftest.py" = ["S101", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["api", "collect_today", "media", "planta", "push", "conftest"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/assets/python/_lambda/v2"]
addopts = "-q"

[tool.coverage.run]
source = ["backend/assets/python/_lambda/v2"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
